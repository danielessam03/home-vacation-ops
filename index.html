    // Mirrors fn_calc_completeness() so the meter is live while typing. The database value is the one that counts.
    function calcCompleteness(row, required) {
      const req = (required || []).filter((f) => f in FIELD_LABEL);
      const missing = req.filter((f) => {
        const v = row[f];
        if (v == null) return true;
        if (typeof v === 'string' && v.trim() === '') return true;
        if (Array.isArray(v) && v.length === 0) return true;
        if (POSITIVE_FIELDS.includes(f) && !(Number(v) > 0)) return true;
        if (f === 'media_uploaded' && v !== true) return true;          // complete only when the photos ARE uploaded
        return false;
      });
      return { pct: req.length ? Math.floor((100 * (req.length - missing.length)) / req.length) : 100, missing };
    }

    // Mirrors vw_listing_sla. Clock: date_received -> verified on the website, minus on_hold time.
    function slaOf(l, slaCfg, now = Date.now()) {
      const warn = Number((slaCfg && slaCfg.warn) || 48), breach = Number((slaCfg && slaCfg.breach) || 72), grace = Number((slaCfg && slaCfg.claim_grace) || 24);
      const verified = !!l.date_published_verified;
      const end = verified ? new Date(l.date_published_verified).getTime() : now;
      let paused = (l.paused_seconds || 0) * 1000;
      const onHold = l.status === 'on_hold' && !verified;
      if (onHold && l.hold_started_at) paused += now - new Date(l.hold_started_at).getTime();
      const hours = Math.max(0, (end - new Date(l.date_received).getTime() - paused) / 36e5);
      const state = ['rejected', 'archived'].includes(l.status) ? 'none' : hours < warn ? 'green' : hours <= breach ? 'yellow' : 'red';
      const claimedNotFound = l.status === 'published_claimed' && !verified && l.date_published_claimed
        && now - new Date(l.date_published_claimed).getTime() > grace * 36e5;
      return { hours, state, verified, onHold, remaining: breach - hours, onTime: verified && hours <= breach, claimedNotFound, breach, warn };
    }

    // ---------- CSV
    function parseCSV(text) {
      const rows = []; let row = [], cur = '', q = false;
      text = text.replace(/^﻿/, '');
      const sep = (text.split('\n')[0] || '').includes(',') ? ',' : ';';     // Excel in some locales exports ';'
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
        else if (c === '"') q = true;
        else if (c === sep) { row.push(cur); cur = ''; }
        else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (c !== '\r') cur += c;
      }
      if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
      return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
    }
    function downloadCSV(filename, headers, rows) {
      const esc = (v) => { const s = v == null ? '' : Array.isArray(v) ? v.join('; ') : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const csv = [headers.map(esc).join(','), ...rows.map((r) => r.map(esc).join(','))].join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    }

    const Icon = ({ name, className = 'w-5 h-5' }) => (

    const Btn = ({ kind = 'primary', className = '', ...p }) => {
      const k = { primary: 'bg-brand-700 text-white hover:bg-brand-800', ghost: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50', danger: 'bg-rose-600 text-white hover:bg-rose-700', ok: 'bg-emerald-600 text-white hover:bg-emerald-700', soft: 'bg-brand-50 text-brand-800 hover:bg-brand-100' }[kind];
      return <button type="button" {...p} className={`inline-flex items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed ${k} ${className}`} />;
    };
    const Card = ({ className = '', children, ...p }) => <div {...p} className={`print-card bg-white rounded-xl border border-slate-200 shadow-sm ${className}`}>{children}</div>;
    const inputCls = (bad) => `w-full rounded-lg border px-3 py-2 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 ${bad ? 'border-rose-500 ring-1 ring-rose-300' : 'border-slate-300'}`;

        {children}
        {hint && <span className="mt-1 block text-xs text-slate-500">{hint}</span>}
      </label>
    );
    const Select = ({ value, onChange, options, placeholder = 'Select…', bad, disabled }) => (
      <select className={inputCls(bad)} value={value == null ? '' : value} disabled={disabled} onChange={(e) => onChange(e.target.value === '' ? null : e.target.value)}>
        <option value="">{placeholder}</option>
        {options.map((o) => Array.isArray(o) ? <option key={o[0]} value={o[0]}>{o[1]}</option> : <option key={o} value={o}>{o}</option>)}
      </select>
    );
    const TriState = ({ value, onChange, bad }) => (
      <div className={`flex rounded-lg border overflow-hidden ${bad ? 'border-rose-500 ring-1 ring-rose-300' : 'border-slate-300'}`}>
        {[[true, 'Yes'], [false, 'No']].map(([v, l]) => (
          <button type="button" key={l} onClick={() => onChange(value === v ? null : v)} className={`flex-1 py-2 text-sm ${value === v ? 'bg-brand-700 text-white' : 'bg-white text-slate-700'}`}>{l}</button>
        ))}
      </div>
    );
    const Modal = ({ title, onClose, children, wide, footer }) => (
      <div className="no-print fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-slate-900/50" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className={`flex max-h-[92vh] w-full flex-col rounded-t-2xl bg-white shadow-xl sm:rounded-2xl ${wide ? 'sm:max-w-3xl' : 'sm:max-w-lg'}`}>
          <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">

            <button onClick={onClose} className="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100" aria-label="Close"><Icon name="x" /></button>

    const PageHeader = ({ title, sub, children }) => (

    const Tile = ({ label, value, target, better = 'high', tone, onClick }) => {

      return (
        <Card className={`p-3 ${onClick ? 'cursor-pointer hover:border-brand-500' : ''} ${tone === 'red' ? 'border-rose-300 bg-rose-50' : ''}`} onClick={onClick}>
          <div className="text-xs text-slate-500">{label}</div>
          <div className={`num mt-1 text-2xl font-bold ${tone === 'red' ? 'text-rose-700' : 'text-slate-900'}`}>{typeof value === 'number' ? show(value) : value == null ? '—' : value}</div>
          {target != null && <div className={`mt-0.5 text-xs ${ok == null ? 'text-slate-500' : ok ? 'text-emerald-700' : 'text-rose-700'}`}>Target {show(Number(target))}{ok == null ? '' : ok ? ' ✓' : ' ✗'}</div>}

    };
    const Tabs = ({ tabs, value, onChange }) => (
      <div className="no-print scroll-x mb-4 flex gap-1 border-b border-slate-200">

    const MonthPicker = ({ value, onChange }) => (
      <div className="no-print inline-flex items-center rounded-lg border border-slate-300 bg-white">

        <span className="min-w-[8.5rem] text-center text-sm font-medium">{monthLabel(value)}</span>
        <button className="px-2.5 py-2 text-slate-600" onClick={() => onChange(addMonths(value, 1))} aria-label="Next month">›</button>
      </div>
    );
    const SlaChip = ({ listing }) => {
      const { cfg, now } = useApp();
      const s = slaOf(listing, cfg.sla_hours, now);
      if (s.state === 'none') return null;
      const st = SLA_STYLE[s.state];
      const text = s.verified ? `Live in ${fmtHours(s.hours)}` : s.onHold ? `Paused · ${fmtHours(s.hours)}` : s.remaining >= 0 ? `${fmtHours(s.remaining)} left` : `${fmtHours(-s.remaining)} over`;
      return <span className={`inline-flex items-center gap-1.5 whitespace-nowrap rounded-full border px-2 py-0.5 text-xs font-semibold ${st.chip}`}><span className={`h-1.5 w-1.5 rounded-full ${st.dot}`} />{text}</span>;
    };
    const StatusBadge = ({ status }) => { const s = LISTING_STATUS[status] || [status, '']; return <Badge className={s[1]}>{s[0]}</Badge>; };
    // Single-series bar chart. Values are labelled directly so no axis is needed.
    const Bars = ({ rows, unit = '' }) => {
      const max = Math.max(1, ...rows.map((r) => r.value || 0));
      return (
        <div className="flex h-36 items-end gap-2">
          {rows.map((r) => (
            <div key={r.label} className="flex min-w-0 flex-1 flex-col items-center justify-end gap-1">
              <span className="num text-[11px] font-medium text-slate-700">{r.value == null ? '—' : show(r.value, unit)}</span>
              <div className="w-full max-w-[44px] rounded-t bg-brand-500" style={{ height: `${Math.max(2, (100 * (r.value || 0)) / max)}px` }} />
              <span className="w-full truncate text-center text-[11px] text-slate-500">{r.label}</span>
            </div>
          ))}
        </div>
      );
    };

    const AppCtx = createContext(null);
    const useApp = () => useContext(AppCtx);

    // =========================================================================================
    // KPI + REPORT MATH (pure functions over the loaded data; same rules as vw_listing_sla / vw_user_kpis)
    // =========================================================================================
    const SHOOT_TYPES = ['photo_shoot', 'video_shoot', 'shoot'];

    function listingStats(listings, channels, slaCfg, now) {
      const live = listings.filter((l) => l.status !== 'archived');
      const s = live.map((l) => slaOf(l, slaCfg, now));
      const verified = s.filter((x) => x.verified);
      const ids = new Set(live.filter((l) => l.status !== 'rejected').map((l) => l.id));
      const ch = channels.filter((c) => ids.has(c.listing_id));
      return {
        entered: live.length,
        verified: verified.length,
        avg_hours: r1(avg(verified.map((x) => x.hours))),
        on_time_pct: pct(verified.filter((x) => x.onTime).length, verified.length),
        avg_completeness: r1(avg(live.map((l) => l.completeness_pct))),
        breached: s.filter((x, i) => x.state === 'red' && live[i].status !== 'rejected').length,
        rejected: live.filter((l) => l.status === 'rejected').length,
        claimed_not_found: s.filter((x) => x.claimedNotFound).length,
        portal_coverage_pct: pct(ch.filter((c) => c.status === 'published').length, ch.length),
      };
    }

    function userKpis(user, range, data, slaCfg, now) {
      const ls = data.listings.filter((l) => l.entered_by === user.id && inRange(l.date_received, range));
      const st = listingStats(ls, data.listing_channels, slaCfg, now);
      const ts = data.tasks.filter((t) => t.assigned_to === user.id && t.status !== 'cancelled' && inRange(t.due_at || t.created_at, range));
      const done = ts.filter((t) => t.status === 'done');
      const onTime = done.filter((t) => !t.due_at || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_at)));
      const lateOpen = ts.filter((t) => t.status !== 'done' && t.due_at && new Date(t.due_at).getTime() < now);
      const shootDone = done.filter((t) => SHOOT_TYPES.includes(t.task_type));
      const mediaListingIds = new Set(done.filter((t) => t.listing_id).map((t) => t.listing_id));
      return {
        user_id: user.id, name: user.full_name || user.email, role: user.role,
        listings_entered: st.entered, avg_completeness: st.avg_completeness, avg_hours_to_publish: st.avg_hours,
        on_time_pct: st.on_time_pct, rejected_count: st.rejected, portal_coverage_pct: st.portal_coverage_pct,
        claimed_not_found: st.claimed_not_found, verified: st.verified, breached: st.breached,
        tasks_completed: done.length, tasks_due: ts.length, tasks_late: lateOpen.length + (done.length - onTime.length),
        tasks_on_time_pct: pct(onTime.length, done.length + lateOpen.length),
        deliverables_logged: data.agency_deliverables.filter((d) => d.logged_by === user.id && inRange(d.created_at, range)).length,
        shoots_completed: shootDone.length,
        media_complete: data.listings.filter((l) => mediaListingIds.has(l.id) && l.media_uploaded === true && l.media_edited === true).length,
      };
    }

    function agencyScorecard(agency, ym, data) {
      const ds = data.agency_deliverables.filter((d) => d.agency_id === agency.id && d.period_month === ym);
      const ms = Object.fromEntries(data.agency_metrics.filter((m) => m.agency_id === agency.id && m.period_month === ym).map((m) => [m.metric_key, Number(m.metric_value)]));
      const planned = ds.reduce((a, d) => a + (d.planned_qty || 0), 0), delivered = ds.reduce((a, d) => a + (d.delivered_qty || 0), 0);
      const deliveredItems = ds.filter((d) => d.delivered_at);
      const onTime = deliveredItems.filter((d) => d.due_date && ymd(d.delivered_at) <= d.due_date);
      const revisions = ds.reduce((a, d) => a + (d.revisions_count || 0), 0);
      const leads = ms.leads != null ? ms.leads : ms.organic_leads;
      const spend = ms.ad_spend != null ? ms.ad_spend : null;
      // cost per lead = ad spend / leads. For an agency with no ad spend (SEO) the monthly fee is the cost.
      const cost = spend != null ? spend : agency.monthly_fee != null ? Number(agency.monthly_fee) : null;
      return {
        label: `${agency.display_name} — ${monthLabel(ym)}`, agency: agency.display_name, month: ym, items: ds.length, planned, delivered,
        delivery_rate: pct(delivered, planned), on_time_pct: pct(onTime.length, deliveredItems.length), revisions,
        revision_rate: pct(revisions, delivered), leads: leads == null ? null : leads, spend,
        cpl: cost != null && leads ? r1(cost / leads) : null, cpl_basis: spend != null ? 'ad spend' : 'monthly fee', currency: agency.currency || '',
      };
    }

    function buildReport(range, label, data, cfg, now) {
      const sla = cfg.sla_hours;
      const received = data.listings.filter((l) => l.status !== 'archived' && inRange(l.date_received, range));
      const verifiedInRange = data.listings.filter((l) => inRange(l.date_published_verified, range));
      const open = data.listings.filter((l) => !['archived', 'rejected', 'verified_live'].includes(l.status));
      const openSla = open.map((l) => slaOf(l, sla, now));
      const tasksDue = data.tasks.filter((t) => t.status !== 'cancelled' && inRange(t.due_at, range));
      const group = (keyFn, labelFn) => {
        const m = new Map();
        received.forEach((l) => { const k = keyFn(l) || '—'; if (!m.has(k)) m.set(k, []); m.get(k).push(l); });
        return [...m.entries()].map(([k, ls]) => ({ label: labelFn ? labelFn(k) : k, ...listingStats(ls, data.listing_channels, sla, now) })).sort((a, b) => b.entered - a.entered);
      };
      const nameOf = (id) => { const p = data.profiles.find((x) => x.id === id); return p ? p.full_name || p.email : '—'; };
      const recIds = new Set(received.filter((l) => l.status !== 'rejected').map((l) => l.id));
      const chRows = data.listing_channels.filter((c) => recIds.has(c.listing_id));
      const channels = [...new Set(chRows.map((c) => c.channel))].map((c) => {
        const rows = chRows.filter((x) => x.channel === c);
        return { label: (cfg.portal_labels || {})[c] || titleCase(c), total: rows.length, published: rows.filter((x) => x.status === 'published').length,
          in_progress: rows.filter((x) => x.status === 'in_progress').length, rejected: rows.filter((x) => x.status === 'rejected').length,
          coverage_pct: pct(rows.filter((x) => x.status === 'published').length, rows.length) };
      });
      const months = [], lastMonth = monthStart(addDays(range.to, -1));
      for (let m = monthStart(range.from); m <= lastMonth && months.length < 24; m = addMonths(m, 1)) months.push(m);
      const recSla = received.map((l) => slaOf(l, sla, now));
      return {
        label, from: ymd(range.from), to: ymd(addDays(range.to, -1)), generated_at: new Date(now).toISOString(),
        summary: {
          entered: received.length, verified: verifiedInRange.length,
          breaches_open: openSla.filter((s) => s.state === 'red').length,
          incomplete_open: open.filter((l) => l.completeness_pct < 100).length,
          claimed_not_found: openSla.filter((s) => s.claimedNotFound).length,
          tasks_completed: tasksDue.filter((t) => t.status === 'done').length, tasks_due: tasksDue.length,
        },
        sla: { green: recSla.filter((s) => s.state === 'green').length, yellow: recSla.filter((s) => s.state === 'yellow').length, red: recSla.filter((s) => s.state === 'red').length },
        kpis: data.profiles.filter((p) => p.is_active && p.role !== 'admin').map((p) => userKpis(p, range, data, sla, now)),
        breakdowns: {
          person: group((l) => l.entered_by, nameOf), source: group((l) => l.source_type, titleCase),
          source_name: group((l) => `${titleCase(l.source_type)} · ${l.source_name}`), location: group((l) => l.location),
          channel: channels, agency: data.agencies.flatMap((a) => months.map((m) => agencyScorecard(a, m, data))).filter((r) => r.items > 0 || r.leads != null),
        },
      };
    }

    // =========================================================================================
    // LISTINGS
    // =========================================================================================
    const ReasonModal = ({ title, label, confirmLabel, kind = 'primary', onClose, onConfirm }) => {
      const [reason, setReason] = useState(''); const [busy, setBusy] = useState(false);
      return (
        <Modal title={title} onClose={onClose} footer={<>
          <Btn kind="ghost" onClick={onClose}>Cancel</Btn>
          <Btn kind={kind} disabled={!reason.trim() || busy} onClick={async () => { setBusy(true); await onConfirm(reason.trim()); setBusy(false); }}>{confirmLabel}</Btn></>}>
          <Field label={label} bad={!reason.trim()}><textarea rows={3} className={inputCls(!reason.trim())} value={reason} onChange={(e) => setReason(e.target.value)} autoFocus /></Field>
        </Modal>
      );
    };

    const FORM_GROUPS = [
      ['Basics', ['title', 'location', 'property_type', 'deal_type', 'date_received']],
      ['Specs', ['area_sqm', 'building_levels', 'floor', 'bedrooms', 'bathrooms', 'balconies', 'furnished', 'view_type']],
      ['Media', ['media_uploaded', 'media_has_logo', 'media_edited', 'cover_photo_belongs']],
      ['Commercial', ['price', 'currency', 'is_exclusive']],
      ['Marketing', ['facilities', 'selling_points', 'buyer_persona_nationality', 'buyer_persona_age_range', 'buyer_persona_gender']],
      ['Owner & source', ['owner_name', 'owner_phone', 'source_type', 'source_name', 'source_contact', 'assigned_to']],
    ];
    const NUM_FIELDS = ['area_sqm', 'building_levels', 'floor', 'bedrooms', 'bathrooms', 'balconies', 'media_images_count', 'media_videos_count', 'price'];
    const BOOL_FIELDS = ['furnished', 'is_exclusive', 'cover_photo_belongs', 'media_uploaded', 'media_has_logo', 'media_edited'];
    const ALWAYS_REQUIRED = ['location', 'property_type', 'deal_type', 'date_received', 'source_type', 'source_name'];   // NOT NULL in the database

    const FacilitiesInput = ({ value, onChange, options, bad }) => {
      const [extra, setExtra] = useState('');
      const all = [...new Set([...(options || []), ...(value || [])])];
      const toggle = (o) => onChange(value.includes(o) ? value.filter((x) => x !== o) : [...value, o]);
      const add = () => { const v = extra.trim(); if (v && !value.includes(v)) onChange([...value, v]); setExtra(''); };
      return (
        <div className={`rounded-lg border p-2 ${bad ? 'border-rose-500 ring-1 ring-rose-300' : 'border-slate-300'}`}>
          <div className="flex flex-wrap gap-1.5">
            {all.map((o) => <button type="button" key={o} onClick={() => toggle(o)} className={`rounded-full border px-2.5 py-1 text-xs ${value.includes(o) ? 'border-brand-700 bg-brand-700 text-white' : 'border-slate-300 bg-white text-slate-700'}`}>{o}</button>)}
          </div>
          <div className="mt-2 flex gap-2">
            <input className={inputCls()} placeholder="Add another facility…" value={extra} onChange={(e) => setExtra(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } }} />
            <Btn kind="ghost" onClick={add}>Add</Btn>
          </div>
        </div>
      );
    };

    const ListingForm = ({ listing, onClose, onSaved }) => {
      const { me, cfg, data, save, reloadWhere, toast } = useApp();
      const isEdit = !!listing;
      const [f, setF] = useState(() => {
        const base = { facilities: [], currency: null, date_received: new Date().toISOString(), source_type: null, media_images_count: '', media_videos_count: '' };
        const src = listing ? { ...listing } : base;
        NUM_FIELDS.forEach((k) => { src[k] = src[k] == null || (!listing && src[k] === 0) ? '' : String(src[k]); });
        if (listing && listing.media_images_count === 0) src.media_images_count = '0';
        if (listing && listing.media_videos_count === 0) src.media_videos_count = '0';
        src.facilities = src.facilities || [];
        return src;
      });
      const [busy, setBusy] = useState(false);
      const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
      const normalized = useMemo(() => { const o = { ...f }; NUM_FIELDS.forEach((k) => { o[k] = f[k] === '' || f[k] == null ? null : Number(f[k]); }); return o; }, [f]);
      const comp = calcCompleteness(normalized, cfg.required_fields);
      const hardMissing = ALWAYS_REQUIRED.filter((k) => !normalized[k] || (typeof normalized[k] === 'string' && !normalized[k].trim()));
      const bad = (k) => comp.missing.includes(k) || hardMissing.includes(k);
      const staff = data.profiles.filter((p) => p.is_active);
      const dup = !isEdit && f.title && data.listings.find((l) => l.title && l.title.trim().toLowerCase() === f.title.trim().toLowerCase());

      const control = (k) => {

    const ListingDetail = ({ id }) => {

                  {channels.map((c) => <ChannelRow key={c.id} c={c} canEdit={canEdit} />)}
                  {canEdit && missingChannels.length > 0 && (
                    <Select value={null} placeholder="+ Add channel…" options={missingChannels.map((c) => [c, cfg.portal_labels[c]])} onChange={(v) => v && save('listing_channels', { listing_id: l.id, channel: v })} />
                  )}
                </div>
                {l.website_url && <a className="mt-3 inline-flex items-center gap-1 text-sm text-brand-700 underline" href={l.website_url} target="_blank" rel="noreferrer"><Icon name="link" className="h-4 w-4" />View on website</a>}
              </Card>
              <Card className="p-4">
                <h3 className="mb-3 text-sm font-semibold text-brand-800">SLA timeline</h3>
                <ol className="space-y-2 border-l-2 border-slate-200 pl-3 text-sm">
                  {timeline.map(([label, at]) => <li key={label}><div className={at ? 'text-slate-900' : 'text-slate-400'}>{label}</div><div className="text-xs text-slate-500">{at ? fmtDateTime(at) : 'pending'}</div></li>)}
                </ol>
                <div className="mt-3 text-sm">{s.verified ? <>Hours to publish: <b className="num">{r1(s.hours)}</b> — {s.onTime ? <span className="text-emerald-700">within {s.breach}h</span> : <span className="text-rose-700">late</span>}</> : <>Elapsed: <b className="num">{fmtHours(s.hours)}</b> of {s.breach}h</>}</div>
                <div className="mt-1 text-xs text-slate-500">Entered by {nameOf(l.entered_by)}</div>
              </Card>
              {mgr && (
                <Card className="p-4">
                  <h3 className="mb-2 text-sm font-semibold text-brand-800">Audit trail</h3>
                  {!audit ? <p className="text-sm text-slate-500">Loading…</p> : !audit.length ? <p className="text-sm text-slate-500">No changes recorded.</p> : (
                    <ul className="max-h-80 space-y-2 overflow-y-auto text-xs">
                      {audit.map((a) => (
                        <li key={a.id} className="border-b border-slate-100 pb-1.5">
                          <div className="text-slate-500">{fmtDateTime(a.changed_at)} · {a.changed_by ? nameOf(a.changed_by) : 'System / verifier'} · {a.table_name === 'listing_channels' ? 'channel' : 'listing'}</div>
                          {a.action === 'insert' ? <div className="text-slate-800">Created</div> : <div className="break-words text-slate-800"><b>{FIELD_LABEL[a.field_name] || a.field_name}</b>: <span className="text-rose-700 line-through">{a.old_value || '∅'}</span> → <span className="text-emerald-700">{a.new_value || '∅'}</span></div>}
                        </li>
                      ))}
                    </ul>
                  )}
                </Card>
              )}
            </div>
          </div>
          {edit && <ListingForm listing={l} onClose={() => setEdit(false)} onSaved={() => setEdit(false)} />}
          {reason === 'hold' && <ReasonModal title="Put on hold" label="Reason (mandatory) — the SLA clock pauses while on hold" confirmLabel="Put on hold" onClose={() => setReason(null)} onConfirm={async (r) => { if (await setStatus('on_hold', { hold_reason: r })) setReason(null); }} />}
          {reason === 'reject' && <ReasonModal kind="danger" title="Reject listing" label="Reason (mandatory)" confirmLabel="Reject" onClose={() => setReason(null)} onConfirm={async (r) => { if (await setStatus('rejected', { rejection_reason: r })) setReason(null); }} />}
        </div>
      );
    };

    const ChannelRow = ({ c, canEdit }) => {
      const { cfg, save } = useApp();
      const [url, setUrl] = useState(c.url || '');
      useEffect(() => setUrl(c.url || ''), [c.url]);
      const verifierOwned = c.channel === 'website';
      return (
        <div className="rounded-lg border border-slate-200 p-2.5">
          <div className="mb-1.5 flex items-center justify-between gap-2">
            <span className="text-sm font-medium text-slate-800">{(cfg.portal_labels || {})[c.channel] || titleCase(c.channel)}</span>
            {c.status === 'published' && <span className="text-xs text-emerald-700">✓ {fmtDate(c.published_at)}</span>}
          </div>
          <div className="grid grid-cols-5 gap-2">
            <div className="col-span-2"><Select value={c.status} disabled={!canEdit} placeholder="Status" options={CHANNEL_STATUSES.map((s) => [s, titleCase(s)])} onChange={(v) => v && save('listing_channels', { status: v }, c.id)} /></div>
            <input className={`${inputCls()} col-span-3`} placeholder="Listing URL" disabled={!canEdit} value={url} onChange={(e) => setUrl(e.target.value)} onBlur={() => { if ((url || '') !== (c.url || '')) save('listing_channels', { url: url || null }, c.id); }} />
          </div>
          {verifierOwned && <p className="mt-1 text-[11px] text-slate-500">The verifier sets this to Published automatically when it finds the File Ref on the site.</p>}
        </div>
      );
    };

    // ---------- Bulk CSV import (backlog): map -> dry-run preview -> commit
    const IMPORT_FIELDS = ['reference_code', 'title', 'owner_name', 'owner_phone', 'location', 'property_type', 'deal_type', 'area_sqm', 'building_levels', 'floor', 'bedrooms', 'bathrooms', 'balconies', 'furnished',
      'media_uploaded', 'media_has_logo', 'media_edited', 'is_exclusive', 'view_type', 'price', 'currency', 'facilities', 'selling_points', 'buyer_persona_nationality',
      'buyer_persona_age_range', 'buyer_persona_gender', 'cover_photo_belongs', 'date_received', 'source_type', 'source_name', 'source_contact'];
    const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

    const CsvImport = ({ onClose }) => {
      const { me, cfg, data, setData, reloadTable, toast } = useApp();
      const [raw, setRaw] = useState(null); const [map, setMap] = useState({}); const [step, setStep] = useState('upload'); const [result, setResult] = useState(null); const [busy, setBusy] = useState(false);
      const onFile = async (file) => {
        const rows = parseCSV(await file.text());
        if (rows.length < 2) { toast('The file has no data rows', 'error'); return; }
        const headers = rows[0].map((h) => h.trim()); const m = {};
        IMPORT_FIELDS.forEach((f) => { const i = headers.findIndex((h) => norm(h) === norm(f) || norm(h) === norm(FIELD_LABEL[f]) || (f === 'reference_code' && ['fileref', 'ref', 'refcode'].includes(norm(h)))); if (i >= 0) m[f] = i; });
        setRaw({ headers, rows: rows.slice(1) }); setMap(m); setStep('map');
      };
      const matchKey = (obj, v) => Object.keys(obj || {}).find((k) => norm(k) === norm(v)) || null;
      const parsed = useMemo(() => {
        if (!raw) return [];
        const existing = new Set(data.listings.map((l) => l.reference_code)); const seen = new Set();
        return raw.rows.map((r, idx) => {
          const get = (f) => map[f] == null ? '' : String(r[map[f]] == null ? '' : r[map[f]]).trim();
          const o = {}; const errors = []; const warnings = [];
          IMPORT_FIELDS.forEach((f) => {
            const v = get(f); if (v === '') return;
            if (NUM_FIELDS.includes(f)) { const n = Number(v.replace(/[, ]/g, '')); if (isNaN(n)) warnings.push(`${f} "${v}" is not a number — skipped`); else o[f] = n; }
            else if (BOOL_FIELDS.includes(f)) o[f] = /^(y|yes|true|1)$/i.test(v) ? true : /^(n|no|false|0)$/i.test(v) ? false : null;
            else if (f === 'facilities') o[f] = v.split(/[;|]/).map((x) => x.trim()).filter(Boolean);
            else if (f === 'date_received') { const d = new Date(v); if (isNaN(d)) warnings.push(`date "${v}" not understood — using now`); else o[f] = d.toISOString(); }
            else o[f] = v;
          });
          if (o.reference_code) o.reference_code = o.reference_code.toUpperCase().replace(/\s/g, '');
          o.location = matchKey(cfg.location_codes, o.location) || o.location; o.property_type = matchKey(cfg.unit_type_codes, o.property_type) || o.property_type;
          o.deal_type = /rent/i.test(o.deal_type || '') ? 'rent' : /sale|sell|buy/i.test(o.deal_type || '') ? 'sale' : o.reference_code && /-R$/.test(o.reference_code) ? 'rent' : o.reference_code && /-S$/.test(o.reference_code) ? 'sale' : null;
          o.source_type = SOURCE_TYPES.find((s) => norm(s) === norm(o.source_type)) || 'other';
          o.source_name = o.source_name || 'Backlog import';
          if (o.currency) o.currency = o.currency.toUpperCase();
          if (!o.location) errors.push('location missing'); else if (!o.reference_code && !(cfg.location_codes || {})[o.location]) errors.push(`no location code for "${o.location}"`);
          if (!o.property_type) errors.push('property type missing'); else if (!o.reference_code && !(cfg.unit_type_codes || {})[o.property_type]) errors.push(`no unit type code for "${o.property_type}"`);
          if (!o.deal_type) errors.push('sale/rent missing');
          if (o.reference_code && (existing.has(o.reference_code) || seen.has(o.reference_code))) errors.push(`${o.reference_code} already exists`);
          if (o.reference_code) seen.add(o.reference_code); else warnings.push('no File Ref — a new code will be generated (paste it into WordPress)');
          return { line: idx + 2, o, errors, warnings, comp: calcCompleteness(o, cfg.required_fields).pct };
        });
      }, [raw, map, cfg, data.listings]);
      const good = parsed.filter((p) => !p.errors.length);

      const commit = async () => {
        setBusy(true); const created = []; const failed = [];
        for (let i = 0; i < good.length; i += 25) {
          const chunk = good.slice(i, i + 25); const payload = chunk.map((p) => ({ ...p.o, entered_by: me.id, assigned_to: me.id }));
          const { data: rows, error } = await sbc.from(tbl('listings')).insert(payload).select();
          if (!error) { created.push(...rows); continue; }
          for (const p of chunk) {        // one bad row must not sink the batch
            const { data: row, error: e2 } = await sbc.from(tbl('listings')).insert({ ...p.o, entered_by: me.id, assigned_to: me.id }).select().single();
            if (e2) failed.push({ line: p.line, error: friendlyError(e2) }); else created.push(row);
          }
        }
        setData((d) => ({ ...d, listings: [...created, ...d.listings] }));
        await reloadTable('listing_channels');
        setBusy(false); setResult({ created: created.length, failed }); setStep('done');
      };
      const template = () => downloadCSV('hv-ops-import-template.csv', IMPORT_FIELDS, [['HD-A-1012-S', 'Sea view apartment in Hadaba', 'Owner name', '+20…', 'Hadaba', 'Apartment', 'sale', 85, 5, 3, 2, 1, 1, 'yes', 'yes', 'yes', 'no', 'no', 'Sea view', 95000, 'EUR', 'Swimming pool; Elevator', 'Walk to the beach', 'German', '45-54', 'Couples', 'yes', '2026-09-01 10:00', 'owner', 'Owner name', '+20…']]);

      return (
        <Modal wide title="Import listings from CSV" onClose={onClose} footer={
          step === 'map' ? <><Btn kind="ghost" onClick={() => setStep('upload')}>Back</Btn><Btn onClick={() => setStep('preview')}>Dry-run preview</Btn></> :
          step === 'preview' ? <><Btn kind="ghost" onClick={() => setStep('map')}>Back</Btn><Btn disabled={!good.length || busy} onClick={commit}>{busy ? 'Importing…' : `Import ${good.length} listing${good.length === 1 ? '' : 's'}`}</Btn></> :
          <Btn kind="ghost" onClick={onClose}>Close</Btn>}>
          {step === 'upload' && (
            <div className="space-y-3 text-sm text-slate-700">
              <p>Use this for the existing backlog. Rows that already have a website <b>File Ref</b> keep it (the verifier will then confirm them as live). Rows without one get a new code that must be pasted into WordPress.</p>
              <input type="file" accept=".csv,text/csv" className="block w-full text-sm" onChange={(e) => e.target.files[0] && onFile(e.target.files[0])} />
              <Btn kind="ghost" onClick={template}>Download template CSV</Btn>
            </div>
          )}
          {step === 'map' && raw && (
            <div>
              <p className="mb-3 text-sm text-slate-600">{raw.rows.length} rows found. Match each HV Ops field to a column in your file.</p>
              <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                {IMPORT_FIELDS.map((f) => (
                  <div key={f} className="flex items-center gap-2">
                    <span className="w-44 shrink-0 text-xs text-slate-700">{f === 'reference_code' ? 'File Ref / reference code' : FIELD_LABEL[f] || f}</span>
                    <Select value={map[f] == null ? null : String(map[f])} placeholder="— not in file —" options={raw.headers.map((h, i) => [String(i), h || `Column ${i + 1}`])} onChange={(v) => setMap((m) => { const n = { ...m }; if (v == null) delete n[f]; else n[f] = Number(v); return n; })} />
                  </div>
                ))}
              </div>
            </div>
          )}
          {step === 'preview' && (
            <div>
              <div className="mb-3 flex flex-wrap gap-2 text-sm"><Badge className="bg-emerald-100 text-emerald-800">{good.length} ready</Badge><Badge className="bg-rose-100 text-rose-800">{parsed.length - good.length} will be skipped</Badge><span className="text-slate-500">Nothing is saved until you press Import.</span></div>
              <div className="scroll-x max-h-[50vh] overflow-y-auto rounded-lg border border-slate-200">
                <table className="w-full text-xs">
                  <thead className="sticky top-0 bg-slate-50 text-left text-slate-500"><tr>{['Line', 'Ref', 'Location', 'Type', 'Deal', 'Price', 'Complete', 'Result'].map((h) => <th key={h} className="px-2 py-1.5">{h}</th>)}</tr></thead>
                  <tbody>{parsed.map((p) => (
                    <tr key={p.line} className={`border-t border-slate-100 ${p.errors.length ? 'bg-rose-50' : ''}`}>
                      <td className="px-2 py-1.5">{p.line}</td><td className="px-2 py-1.5 font-mono">{p.o.reference_code || <i className="text-slate-400">new</i>}</td><td className="px-2 py-1.5">{p.o.location}</td><td className="px-2 py-1.5">{p.o.property_type}</td><td className="px-2 py-1.5">{p.o.deal_type}</td>
                      <td className="px-2 py-1.5">{money(p.o.price, p.o.currency)}</td><td className="px-2 py-1.5">{p.comp}%</td>
                      <td className="px-2 py-1.5">{p.errors.length ? <span className="text-rose-700">Skip: {p.errors.join('; ')}</span> : <span className="text-emerald-700">OK{p.warnings.length ? <span className="text-amber-700"> · {p.warnings.join('; ')}</span> : ''}</span>}</td>
                    </tr>))}</tbody>
                </table>
              </div>
            </div>
          )}
          {step === 'done' && result && (
            <div className="space-y-2 text-sm"><p className="font-medium text-emerald-700">{result.created} listings imported.</p>
              {result.failed.length > 0 && <div className="text-rose-700">{result.failed.map((x) => <div key={x.line}>Line {x.line}: {x.error}</div>)}</div>}</div>
          )}
        </Modal>
      );
    };

    // =========================================================================================
    // TASKS — kanban on desktop, list on phone. Staff move To do -> Doing -> Review; a manager approves.
    // =========================================================================================
    const isOverdue = (t, now) => t.due_at && !['done', 'cancelled'].includes(t.status) && new Date(t.due_at).getTime() < now;

    const TaskForm = ({ task, preset, onClose }) => {
      const { me, data, cfg, save, toast } = useApp();
      const [f, setF] = useState(task || { title: '', description: '', task_type: null, assigned_to: me.id, priority: 'normal', due_at: null, listing_id: null, agency: null, ...(preset || {}) });
      const [busy, setBusy] = useState(false);
      const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
      const submit = async () => {
        if (!f.title.trim()) { toast('Title is required', 'error'); return; }
        setBusy(true);
        const payload = { title: f.title.trim(), description: f.description || null, task_type: f.task_type, assigned_to: f.assigned_to, priority: f.priority || 'normal', due_at: f.due_at, listing_id: f.listing_id, agency: f.agency };
        if (!task) payload.created_by = me.id;
        const row = await save('tasks', payload, task ? task.id : null);
        setBusy(false); if (row) { toast('Task saved'); onClose(); }
      };
      return (
        <Modal title={task ? 'Edit task' : 'New task'} onClose={onClose} footer={<><Btn kind="ghost" onClick={onClose}>Cancel</Btn><Btn onClick={submit} disabled={busy}>Save</Btn></>}>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Title" className="col-span-2" bad={!f.title.trim()}><input className={inputCls(!f.title.trim())} value={f.title} onChange={(e) => set('title', e.target.value)} autoFocus /></Field>
            <Field label="Description" className="col-span-2"><textarea rows={3} className={inputCls()} value={f.description || ''} onChange={(e) => set('description', e.target.value)} /></Field>
            <Field label="Assignee"><Select value={f.assigned_to} onChange={(v) => set('assigned_to', v)} options={data.profiles.filter((p) => p.is_active).map((p) => [p.id, p.full_name || p.email])} /></Field>
            <Field label="Type"><Select value={f.task_type} onChange={(v) => set('task_type', v)} options={(cfg.task_types || []).map((t) => [t, titleCase(t)])} /></Field>
            <Field label="Due"><input type="datetime-local" className={inputCls()} value={toLocalInput(f.due_at)} onChange={(e) => set('due_at', fromLocalInput(e.target.value))} /></Field>
            <Field label="Priority"><Select value={f.priority} onChange={(v) => set('priority', v || 'normal')} options={Object.keys(PRIORITY).map((p) => [p, titleCase(p)])} /></Field>
            <Field label="Linked listing (optional)"><Select value={f.listing_id} onChange={(v) => set('listing_id', v)} placeholder="None" options={data.listings.filter((l) => l.status !== 'archived').slice(0, 500).map((l) => [l.id, `${l.reference_code}${l.title ? ' · ' + l.title.slice(0, 30) : ''}`])} /></Field>
            <Field label="Agency (optional)"><Select value={f.agency} onChange={(v) => set('agency', v)} placeholder="None" options={data.agencies.map((a) => [a.name, a.display_name])} /></Field>
          </div>
        </Modal>
      );
    };

    const TaskCard = ({ t, onOpen, draggable }) => {
      const { now, nameOf, data } = useApp();
      const over = isOverdue(t, now); const l = t.listing_id && data.listings.find((x) => x.id === t.listing_id);
      return (
        <div draggable={draggable} onDragStart={(e) => e.dataTransfer.setData('text/plain', t.id)} onClick={() => onOpen(t)}
          className={`cursor-pointer rounded-lg border bg-white p-2.5 shadow-sm hover:border-brand-500 ${over ? 'border-rose-400' : 'border-slate-200'}`}>
          <div className="text-sm font-medium text-slate-900">{t.title}</div>
          <div className="mt-1.5 flex flex-wrap items-center gap-1">
            <Badge className={PRIORITY[t.priority]}>{titleCase(t.priority)}</Badge>
            {t.task_type && <Badge>{titleCase(t.task_type)}</Badge>}
            {l && <Badge className="bg-brand-50 font-mono text-brand-800">{l.reference_code}</Badge>}
            {t.agency && <Badge className="bg-violet-100 text-violet-800">{titleCase(t.agency)}</Badge>}
            {t.recurring_template_id && <Badge>↻</Badge>}
          </div>
          <div className="mt-1.5 flex items-center justify-between text-xs"><span className="text-slate-500">{nameOf(t.assigned_to)}</span><span className={over ? 'font-semibold text-rose-700' : 'text-slate-500'}>{t.due_at ? `${over ? 'Overdue · ' : ''}${fmtDateTime(t.due_at)}` : 'No due date'}</span></div>
          {t.rejection_reason && t.status !== 'done' && <div className="mt-1.5 rounded bg-amber-50 p-1.5 text-xs text-amber-900">Sent back: {t.rejection_reason}</div>}
        </div>
      );
    };

    const TaskDetail = ({ t, onClose }) => {
      const { me, save, nameOf, go, data, toast } = useApp();
      const [edit, setEdit] = useState(false); const [back, setBack] = useState(false);
      const mgr = isMgr(me); const mine = t.assigned_to === me.id || t.created_by === me.id;
      const move = async (status, extra = {}) => { const row = await save('tasks', { status, ...extra }, t.id); if (row) { toast(`Moved to ${titleCase(status)}`); onClose(); } };
      const l = t.listing_id && data.listings.find((x) => x.id === t.listing_id);
      if (edit) return <TaskForm task={t} onClose={onClose} />;
      if (back) return <ReasonModal title="Send back" label="What needs to change? (mandatory)" confirmLabel="Send back to Doing" kind="danger" onClose={() => setBack(false)} onConfirm={(r) => move('doing', { rejection_reason: r })} />;
      return (
        <Modal title={t.title} onClose={onClose} footer={<>
          {(mgr || mine) && t.status !== 'done' && <Btn kind="ghost" onClick={() => setEdit(true)}>Edit</Btn>}
          {(mgr || mine) && t.status === 'todo' && <Btn onClick={() => move('doing')}>Start</Btn>}
          {(mgr || mine) && t.status === 'doing' && <Btn onClick={() => move('review')}>Submit for review</Btn>}
          {(mgr || mine) && t.status === 'doing' && <Btn kind="ghost" onClick={() => move('todo')}>Back to To do</Btn>}
          {mgr && t.status === 'review' && <><Btn kind="danger" onClick={() => setBack(true)}>Send back</Btn><Btn kind="ok" onClick={() => move('done')}>Approve</Btn></>}
          {mgr && !['done', 'cancelled'].includes(t.status) && <Btn kind="ghost" onClick={() => { if (confirm('Cancel this task?')) move('cancelled'); }}>Cancel task</Btn>}
          {!mgr && t.status === 'review' && <span className="self-center text-sm text-slate-500">Waiting for manager approval</span>}</>}>
          <div className="space-y-3 text-sm">
            <div className="flex flex-wrap gap-1.5"><Badge className="bg-brand-50 text-brand-800">{titleCase(t.status)}</Badge><Badge className={PRIORITY[t.priority]}>{titleCase(t.priority)}</Badge>{t.task_type && <Badge>{titleCase(t.task_type)}</Badge>}</div>
            {t.description && <p className="whitespace-pre-wrap text-slate-700">{t.description}</p>}
            {t.rejection_reason && <div className="rounded bg-amber-50 p-2 text-amber-900">Last sent back: {t.rejection_reason}</div>}
            <dl className="grid grid-cols-2 gap-2">
              {[['Assignee', nameOf(t.assigned_to)], ['Created by', nameOf(t.created_by)], ['Due', fmtDateTime(t.due_at)], ['Started', fmtDateTime(t.started_at)], ['Submitted', fmtDateTime(t.completed_at)], ['Approved', t.approved_at ? `${fmtDateTime(t.approved_at)} · ${nameOf(t.approved_by)}` : '—']].map(([k, v]) => <div key={k}><dt className="text-xs text-slate-500">{k}</dt><dd>{v}</dd></div>)}
            </dl>
            {l && <button className="text-brand-700 underline" onClick={() => { onClose(); go('listing', l.id); }}>Open listing {l.reference_code}</button>}
          </div>
        </Modal>
      );
    };

    const TemplatesModal = ({ onClose }) => {
      const { me, data, cfg, save, toast, workerCall } = useApp();
      const blank = { title: '', description: '', task_type: null, assigned_to: null, priority: 'normal', frequency: 'daily', weekday: 0, day_of_month: 1, due_time: '17:00', is_active: true };
      const [f, setF] = useState(null);
      const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const submit = async () => {
        if (!f.title.trim() || !f.assigned_to) { toast('Title and assignee are required', 'error'); return; }
        const payload = { title: f.title.trim(), description: f.description || null, task_type: f.task_type, assigned_to: f.assigned_to, priority: f.priority, frequency: f.frequency,

                    <div className={`truncate text-sm font-medium ${t.is_active ? 'text-slate-900' : 'text-slate-400 line-through'}`}>{t.title}</div>
                    <div className="text-xs text-slate-500">{titleCase(t.frequency)}{t.frequency === 'weekly' ? ` · ${days[t.weekday]}` : t.frequency === 'monthly' ? ` · day ${t.day_of_month}` : ''} · due {(t.due_time || '').slice(0, 5)} · {(data.profiles.find((p) => p.id === t.assigned_to) || {}).full_name || '—'}</div>
                  </button>
                  <Btn kind="ghost" className="!py-1" onClick={() => save('recurring_templates', { is_active: !t.is_active }, t.id)}>{t.is_active ? 'Pause' : 'Resume'}</Btn>
                </div>
              ))}
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Title" className="col-span-2" bad={!f.title.trim()}><input className={inputCls(!f.title.trim())} value={f.title} onChange={(e) => set('title', e.target.value)} /></Field>
              <Field label="Description" className="col-span-2"><textarea rows={2} className={inputCls()} value={f.description || ''} onChange={(e) => set('description', e.target.value)} /></Field>
              <Field label="Assignee" bad={!f.assigned_to}><Select bad={!f.assigned_to} value={f.assigned_to} onChange={(v) => set('assigned_to', v)} options={data.profiles.filter((p) => p.is_active).map((p) => [p.id, p.full_name || p.email])} /></Field>

            </div>

    const TasksPage = () => {
      const { me, data, now, save, toast } = useApp();
      const mgr = isMgr(me);
      const [who, setWho] = useState(mgr ? null : me.id); const [form, setForm] = useState(false); const [open, setOpen] = useState(null); const [tpl, setTpl] = useState(false); const [col, setCol] = useState('todo');
      const tasks = data.tasks.filter((t) => t.status !== 'cancelled' && (!who || t.assigned_to === who));
      const recentDone = (t) => t.status !== 'done' || now - new Date(t.approved_at || t.updated_at).getTime() < 14 * 864e5;
      const byCol = (k) => tasks.filter((t) => t.status === k && recentDone(t)).sort((a, b) => (new Date(a.due_at || '2999') - new Date(b.due_at || '2999')));
      const openTask = open && data.tasks.find((t) => t.id === open);
      const drop = async (e, status) => {
        e.preventDefault(); const t = data.tasks.find((x) => x.id === e.dataTransfer.getData('text/plain'));
        if (!t || t.status === status) return;
        if (!mgr && (status === 'done' || t.status === 'done')) { toast('Only a manager can approve tasks', 'error'); return; }
        if (t.status === 'review' && ['todo', 'doing'].includes(status)) { setOpen(t.id); toast('Open the task and use “Send back” — a reason is required', 'error'); return; }
        await save('tasks', { status }, t.id);
      };
      return (
        <div>
          <PageHeader title="Tasks" sub={`${tasks.filter((t) => isOverdue(t, now)).length} overdue · ${tasks.filter((t) => t.status === 'review').length} waiting approval`}>
            <div className="w-44"><Select value={who} onChange={setWho} placeholder="Everyone" options={data.profiles.filter((p) => p.is_active).map((p) => [p.id, p.id === me.id ? 'My tasks' : p.full_name || p.email])} /></div>

    // =========================================================================================
    // AGENCIES — no agency logins; our staff log their deliverables and numbers
    // =========================================================================================
    const DeliverableForm = ({ agency, month, item, onClose }) => {
      const { me, cfg, save, toast } = useApp();
      const mgr = isMgr(me);
      const [f, setF] = useState(item || { item_type: null, planned_qty: 1, delivered_qty: 0, due_date: '', status: 'planned', revisions_count: 0, proof_url: '', notes: '' });
      const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
      const statuses = Object.keys(DELIV_STATUS).filter((s) => mgr || s !== 'approved' || f.status === 'approved');
      const submit = async () => {
        if (!f.item_type) { toast('Choose an item type', 'error'); return; }

          </div>

    const MetricsPanel = ({ agency, month, canWrite }) => {
      const { me, data, cfg, setData, toast } = useApp();
      const defs = (cfg.metric_defs || {})[agency.name] || [];
      const existing = data.agency_metrics.filter((m) => m.agency_id === agency.id && m.period_month === month);
      const [vals, setVals] = useState({}); const [busy, setBusy] = useState(false);
      useEffect(() => setVals(Object.fromEntries(existing.map((m) => [m.metric_key, m.metric_value == null ? '' : String(m.metric_value)]))), [agency.id, month, existing.length]);
      const saveAll = async () => {
        setBusy(true);
        const rows = defs.filter((d) => vals[d.key] !== undefined && vals[d.key] !== '').map((d) => ({ agency_id: agency.id, period_month: month, metric_key: d.key, metric_value: Number(vals[d.key]), unit: d.unit, entered_by: me.id, source: 'manual' }));

        setBusy(false);

          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">

              <input type="number" step="any" disabled={!canWrite} className={inputCls()} value={vals[d.key] == null ? '' : vals[d.key]} onChange={(e) => setVals((p) => ({ ...p, [d.key]: e.target.value }))} /></Field>)}

        </Card>
      );
    };

    const AgenciesPage = () => {
      const { me, data, save } = useApp();
      const agencies = data.agencies.filter((a) => a.is_active);
      const [aid, setAid] = useState(agencies[0] && agencies[0].id); const [month, setMonth] = useState(monthStart()); const [form, setForm] = useState(null);
      const agency = agencies.find((a) => a.id === aid) || agencies[0];
      if (!agency) return <Empty>No agencies yet. Run sql/002_seed_settings.sql.</Empty>;
      const canWrite = ['admin', 'manager', 'marketing'].includes(me.role); const mgr = isMgr(me);
      const items = data.agency_deliverables.filter((d) => d.agency_id === agency.id && d.period_month === month).sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
      const trend = [0, -1, -2, -3].map((n) => agencyScorecard(agency, addMonths(month, n), data));
      const sc = trend[0]; const delta = (k) => sc[k] != null && trend[1][k] != null ? r1(sc[k] - trend[1][k]) : null;
      const copyLast = async () => {
        const prev = data.agency_deliverables.filter((d) => d.agency_id === agency.id && d.period_month === addMonths(month, -1));
        for (const p of prev) {
          const due = p.due_date ? ymd(new Date(new Date(p.due_date).getFullYear(), new Date(p.due_date).getMonth() + 1, new Date(p.due_date).getDate())) : null;
          await save('agency_deliverables', { agency_id: agency.id, period_month: month, item_type: p.item_type, planned_qty: p.planned_qty, due_date: due, logged_by: me.id });
        }

      return (
        <div>
          <PageHeader title="Agencies" sub="Contract scorecards — the renewal document"><MonthPicker value={month} onChange={setMonth} /><Btn kind="ghost" onClick={() => window.print()}><Icon name="print" className="h-4 w-4" />Print</Btn></PageHeader>
          <Tabs value={agency.id} onChange={setAid} tabs={agencies.map((a) => [a.id, a.display_name])} />
          <div className="space-y-4">
            <Card className="p-4">
              <div className="flex flex-wrap items-start justify-between gap-2">
                <div><h2 className="text-lg font-bold text-slate-900">{agency.display_name}</h2><p className="text-sm text-slate-600">{agency.scope_notes || '—'}</p></div>
                <div className="text-right text-sm"><div className="num text-lg font-semibold">{agency.monthly_fee != null ? `${money(agency.monthly_fee, agency.currency)} / month` : 'Fee not set'}</div><div className="text-slate-500">{agency.contract_start ? `${fmtDate(agency.contract_start)} → ${fmtDate(agency.contract_end)}` : 'Contract period not set'}</div></div>

              <div className="mt-2 text-sm text-slate-600">Contact: {agency.contact_person || '—'}{agency.contact_email ? ` · ${agency.contact_email}` : ''}{agency.contact_phone ? ` · ${agency.contact_phone}` : ''}</div>
              {me.role === 'admin' && <p className="no-print mt-1 text-xs text-slate-400">Edit the contract in Settings → Agencies.</p>}
            </Card>

            <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
              <Tile label={`Delivery rate${delta('delivery_rate') != null ? ` (${delta('delivery_rate') >= 0 ? '+' : ''}${delta('delivery_rate')} vs prev)` : ''}`} value={sc.delivery_rate == null ? null : `${sc.delivery_rate}%`} />
              <Tile label="On-time delivery" value={sc.on_time_pct == null ? null : `${sc.on_time_pct}%`} />

                  <tbody>{items.map((d) => (
                    <tr key={d.id} className="border-t border-slate-100">
                      <td className="px-2 py-2 font-medium">{titleCase(d.item_type)}{d.notes && <div className="text-xs font-normal text-slate-500">{d.notes}</div>}</td>

                      <td className="px-2 py-2">{d.proof_url ? <a className="text-brand-700 underline" href={d.proof_url} target="_blank" rel="noreferrer">Open</a> : '—'}</td>

                </table></div>

            </Card>

            <Card className="p-4">
              <h3 className="mb-3 text-sm font-semibold text-brand-800">Monthly scorecard — trend</h3>

                  </tr>))}</tbody>
              </table></div>
            </Card>
          </div>
          {form && <DeliverableForm agency={agency} month={month} item={form.id ? form : null} onClose={() => setForm(null)} />}
        </div>
      );
    };

    // =========================================================================================
    // KPIs — per-person cards, leaderboard, monthly targets
    // =========================================================================================
    const kpiDefsFor = (cfg, role) => (cfg.user_kpi_defs || []).filter((d) => role === 'manager' || role === 'admin' ? true : d.team === role);
    const targetOf = (data, userId, month, key) => { const t = data.kpi_targets.find((x) => x.subject_type === 'user' && x.subject_id === userId && x.period_month === month && x.metric_key === key); return t ? Number(t.target_value) : null; };

          <div className="grid grid-cols-2 gap-3">{defs.map((d) => <Field key={d.key} label={`${d.label} ${d.better === 'low' ? '(max)' : '(min)'}`}><input type="number" step="any" className={inputCls()} value={vals[d.key]} onChange={(e) => setVals((p) => ({ ...p, [d.key]: e.target.value }))} /></Field>)}</div>
        </Modal>
