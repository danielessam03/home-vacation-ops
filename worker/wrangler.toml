name = "hv-ops-verifier"
main = "verifier.js"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# hourly verifier  +  nightly recurring tasks (22:00 UTC = 00:00 Cairo winter / 01:00 summer)
# hourly verifier + alerts · nightly recurring tasks · every 5 min: WhatsApp task messages
crons = ["0 * * * *", "0 22 * * *", "*/5 * * * *"]

[vars]
WP_BASE_URL = "https://home-vacation.com"
WP_CPT = "unit"
# Free Workers plan allows 50 outbound requests per run. 25 page fetches keeps the run inside that.
# The first backfill of ~500 existing pages therefore takes about a day of hourly runs. On a paid plan raise this to 300.
MAX_PAGE_FETCHES = "25"
# E-mail task messages via Resend: set EMAIL_ENABLED = "true" once RESEND_API_KEY is stored and the sending domain is verified
EMAIL_ENABLED = "false"
EMAIL_FROM = "Home Vacation Tasks <tasks@home-vacation.com>"
WHATSAPP_ENABLED = "false"
# Which queued messages may go out by WhatsApp (hv_notifications.entity_type, comma separated; empty = all task messages).
# Daniel 2026-11-17: photography alerts only.
WHATSAPP_ENTITY_TYPES = "photo"
# Critical HV Ops alerts (SLA breached …) by WhatsApp too — needs the extra template hv_ops_alert
WHATSAPP_CRITICAL_ALERTS = "false"
# Kapso ids given by Daniel 2026-11-17 (identifiers, not secrets). The key itself is the secret KAPSO_API_KEY.
WHATSAPP_PHONE_NUMBER_ID = "597907523413541"
WHATSAPP_BUSINESS_ACCOUNT_ID = "2102230076919824"
# WhatsApp template used for task messages (create it in Meta Business > WhatsApp > Message templates, category Utility)
WHATSAPP_TASK_TEMPLATE = "hv_task_assigned"
WHATSAPP_TEMPLATE_LANG = "ar"

# Secrets — set with:  npx wrangler secret put NAME
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   RESEND_API_KEY              (e-mail task messages)
# WhatsApp goes through Kapso (kapso.ai — a gateway in front of Meta's official WhatsApp API, same message format):
#   KAPSO_API_KEY                 (Kapso → Integrations → API keys)           — secret
#   WHATSAPP_PHONE_NUMBER_ID      (Kapso → WhatsApp → Phone numbers)          — an id, not a password
#   WHATSAPP_BUSINESS_ACCOUNT_ID  (the WhatsApp Business Account id; needed to create the template from Settings)
# Without KAPSO_API_KEY the worker talks to Meta directly and needs WHATSAPP_TOKEN instead.
